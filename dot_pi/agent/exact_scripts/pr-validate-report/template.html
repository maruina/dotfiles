<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#17202a;--muted:#536273;--line:#d9e1e8;--paper:#f5f8fb;--card:#fff;--blue:#155eef;--red:#b42318;--red-bg:#fff1f0;--amber:#9a6700;--amber-bg:#fff8e6;--green:#067647;--green-bg:#ecfdf3;--shadow:0 5px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:#175cd3;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
.wrap{max-width:1160px;margin:0 auto;padding:24px}
.hero,.card,.table-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hero{padding:26px 30px;border-top:5px solid var(--green)}
.hero.fail{border-top-color:var(--red)}
.hero.open{border-top-color:#f0ad24}
.hero h2{font-size:1.05rem;margin:22px 0 8px}
.eyebrow{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.08em}
.hero h1{font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.15;margin:8px 0}
.lead{font-size:1.1rem;max-width:860px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.83rem;background:#fff;color:var(--ink)}
.chip.fail{border-color:#fda29b;background:var(--red-bg);color:var(--red)}
.chip.open{border-color:#f7c65f;background:var(--amber-bg);color:var(--amber)}
.chip.pass{border-color:#75e0a7;background:var(--green-bg);color:var(--green)}
.table-card{padding:18px 20px;margin:16px 0 0}
.table-card h2{font-size:1.1rem;margin:0 0 10px}
/* deliberate: fixed layout and wrapping keep every table inside the page width; no table may scroll sideways. */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:9px 10px;overflow-wrap:anywhere}
th{font-size:.83rem;color:#344054;background:#f8fafc}
tr:last-child td{border-bottom:0}
.status{font-weight:700}
.status.fail{color:var(--red)}
.status.open{color:var(--amber)}
.status.pass{color:var(--green)}
.nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;background:rgba(245,248,251,.96);backdrop-filter:blur(8px)}
.nav a{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;text-decoration:none}
.nav a:hover{border-color:var(--blue)}
.chapter{margin:24px 0;scroll-margin-top:96px}
.chapter>h2{font-size:1.55rem;margin:0 0 12px}
.card{padding:20px 22px;margin:12px 0;scroll-margin-top:96px}
.card h3{font-size:1.08rem;margin:0 0 8px}
.card h4{font-size:.96rem;margin:16px 0 4px}
.card p{max-width:860px}
.muted{color:var(--muted)}
.flow{margin:6px 0 0;padding-left:22px;max-width:860px}
.flow li{margin:4px 0}
.walk-step{border-left:4px solid #98a2b3}
.walk-step.issue{border-left-color:var(--red)}
.walk-step.question{border-left-color:#f0ad24}
.parts{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:6px 14px;margin:8px 0 0}
.parts dt{font-weight:650;color:#344054}
.parts dd{margin:0}
.slot{padding:12px 14px;margin:10px 0;border:1px solid var(--line);border-radius:11px;background:#fff}
.slot h4{font-size:.9rem;color:#344054;margin:0 0 5px}
.slot p{margin:0}
.excerpt{padding:12px 14px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.mermaid-wrap{padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin:10px 0 0}
.mermaid{text-align:center;margin:0}
.mermaid svg{max-width:100%;height:auto}
.copybox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}
.copybox label{display:block;font-weight:650;margin-bottom:7px}
.copyrow{display:flex;gap:10px;align-items:flex-start}
.copyrow textarea{flex:1;min-width:0;min-height:100px;resize:vertical;border:1px solid #98a2b3;border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:#fff}
.copyrow button{border:0;border-radius:8px;background:#175cd3;color:#fff;padding:9px 13px;font-weight:650;cursor:pointer}
.copyrow button:hover{background:#1849a9}
.copy-status{font-size:.85rem;color:var(--muted);margin:6px 0 0}
details{border:1px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;padding:12px 14px;scroll-margin-top:96px}
summary{cursor:pointer;font-weight:650}
details table,details ul{margin-top:10px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;overflow-wrap:anywhere}
.small{font-size:.9rem}
.foot{color:var(--muted);font-size:.84rem;padding:20px 0 36px}
@media(max-width:650px){.wrap{padding:12px}.hero{padding:20px}.card{padding:16px}.copyrow{display:block}.copyrow button{margin-top:8px}.parts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
{{BODY}}
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
if(window.mermaid){mermaid.initialize({startOnLoad:true,securityLevel:"strict",theme:"base",themeVariables:{primaryColor:"#eff8ff",primaryTextColor:"#17202a",primaryBorderColor:"#84adff",lineColor:"#667085",secondaryColor:"#fff1f0",tertiaryColor:"#fff8e6"}});}
document.querySelectorAll("[data-copy]").forEach(function(button){button.addEventListener("click",async function(){var box=document.getElementById(button.dataset.copy);var status=document.getElementById(button.dataset.status);try{await navigator.clipboard.writeText(box.value);status.textContent="Copied.";}catch(error){box.focus();box.select();var copied=false;try{copied=document.execCommand("copy");}catch(fallbackError){}status.textContent=copied?"Copied.":"Copy failed. The comment text is selected; use your copy shortcut.";}});});
</script>
</body>
</html>
